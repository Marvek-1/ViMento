services:
  vibe-trading:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: vibe-trading:latest
    container_name: vibe-trading-app
    restart: always
    ports:
      - "${HOST_PORT:-3000}:3000"
      - "${API_PORT:-8899}:8899"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VIBE_PAPER_DATABASE_URL=postgresql://vibe_user:${POSTGRES_PASSWORD:-vibe_secure_pass_2026}@paper-db:5432/vibe_trading
      - TRADING_MODE=${TRADING_MODE:-paper}
      - ENABLE_LIVE_TRADING=${ENABLE_LIVE_TRADING:-false}
      - REQUIRE_MANUAL_APPROVAL=${REQUIRE_MANUAL_APPROVAL:-false}
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      - OKX_SIMULATOR=${OKX_SIMULATOR:-1}
    volumes:
      - vibe-data:/app/data
      - vibe-logs:/app/logs
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/paper_sessions
    depends_on:
      paper-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 512M

  paper-db:
    image: postgres:16-alpine
    container_name: vibe-trading-db
    restart: always
    environment:
      POSTGRES_DB: vibe_trading
      POSTGRES_USER: vibe_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe_secure_pass_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_user -d vibe_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  vibe-data:
    name: vibe_app_data
  vibe-logs:
    name: vibe_app_logs
  vibe-runs:
    name: vibe_app_runs
  vibe-sessions:
    name: vibe_app_sessions
  postgres-data:
    name: vibe_postgres_data
