name: Sync from AI Studio Builder

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  schedule:
    - cron: '0 */6 * * *' # Optional: automatically sync every 6 hours (you can remove this if you only want manual sync)

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download AI Studio Snapshot
        run: |
          echo "Downloading latest build bundle..."
          curl -L "https://ais-dev-hyo5stcg65m7k5vmtwvm2l-430508190624.europe-west2.run.app/vibe-trading.zip" -o vibe-trading.zip
          
          echo "Extracting snapshot..."
          unzip -o vibe-trading.zip -d extracted_repo
          rm vibe-trading.zip

      - name: Merge & Clean Up Files
        run: |
          # Copy extracted contents into the repository root, overwriting changed files
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.github' extracted_repo/ ./
          rm -rf extracted_repo

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Studio Sync Bot"
          git config --global user.email "actions@github.com"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Auto-sync latest build from AI Studio builder [skip ci]"
            git push origin main
          fi
