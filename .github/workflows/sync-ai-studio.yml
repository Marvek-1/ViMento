name: Sync from AI Studio Builder

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Project Structure & Install Dependencies
        run: |
          echo "Verifying project files..."
          npm install
          
          if [ -d "frontend" ]; then
            echo "Building frontend..."
            cd frontend
            npm install
            npm run build
            cd ..
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Studio Sync Bot"
          git config --global user.email "actions@github.com"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Auto-sync project structure and build [skip ci]"
            git push origin main
          fi
